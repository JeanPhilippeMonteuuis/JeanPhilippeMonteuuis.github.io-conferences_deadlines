name: Update Conference Deadlines

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:      # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Fetch deadline updates
        run: uv run scripts/update_deadlines.py

      - name: Create pull request if changes detected
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/update-deadlines
          commit-message: "chore: auto-update conference deadlines"
          title: "chore: auto-update conference deadlines"
          body: |
            Automated deadline updates fetched from upstream sources:
            - [sec-deadlines](https://github.com/sec-deadlines/sec-deadlines.github.io)
            - [ai-deadlines](https://github.com/abhshkdz/ai-deadlines)

            Only existing conference entries were updated (`deadline`, `year`, `date`, `place`, `link`, `comment`).
            Tags and local-only conferences are unchanged.

            Please review the diff before merging.
          labels: automated
          delete-branch: true
